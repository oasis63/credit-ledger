# Credit Ledger on a server, with automatic HTTPS (Caddy + Let's Encrypt).
#   ./setup.sh             # creates .env with random secrets, asks for your domain
#   docker compose up -d
# See DEPLOY.md in the repository root.
name: credit-ledger

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./setup.sh first}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    # Prebuilt by GitHub Actions (release.yml). `docker compose build` builds here instead.
    image: ${API_IMAGE:-ghcr.io/your-github-user/credit-ledger-api:latest}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://ledger:${POSTGRES_PASSWORD}@db:5432/ledger
      NODE_ENV: production
      PUBLIC_WEB_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/your-github-user/credit-ledger-web:latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Extra sites on this server (e.g. devnotes): drop *.caddy files here.
      - ./caddy-extra:/etc/caddy/extra:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
